name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p windows-receiver --examples --locked
      - run: python -m unittest discover -s tests/interoperability -p "test_*.py"
      - name: Native queue checks (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/test-native.sh
      - name: Native queue checks (Windows subset)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-native-windows.ps1
      - run: cargo build --workspace --release --locked
      - name: Dashboard browser check
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-dashboard.ps1
      - name: Desktop channel check
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          [Console]::InputEncoding = New-Object Text.UTF8Encoding($true)
          ./scripts/test-desktop.ps1
      - name: Latency configuration check
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-latency.ps1
      - run: cargo run -p windows-receiver --locked
      - run: cargo run --release --locked -p audio-transport --example crypto_bench
      - name: Package Windows receiver
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/package-windows.ps1 -Destination build/windows
      - name: Windows installation check
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-package.ps1 -PackageDirectory build/windows
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: covoo-windows-x64
          path: build/windows.zip
          if-no-files-found: error
  ios:
    timeout-minutes: 30
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Test native queue
        run: bash ../../scripts/test-native.sh
      - name: Test Swift to Rust network path
        run: bash ../../scripts/test-swift-network.sh
      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
          xcodegen --version
          xcodegen generate
      - name: Build simulator and device (unsigned)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../build
          xcodebuild -project PhoneMic.xcodeproj -scheme PhoneMic -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../build/simulator -resultBundlePath ../../build/simulator.xcresult CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../build/ios-simulator.log
          xcodebuild -project PhoneMic.xcodeproj -scheme PhoneMic -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath ../../build/device -resultBundlePath ../../build/device.xcresult CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../build/ios-device.log
      - name: Test synthetic recording
        run: bash ../../scripts/test-ios.sh
      - name: Package for local signing
        run: bash ../../scripts/package-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: covoo-ios-sideload-package
          path: build/covoo-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: covoo-ios-build-and-logs
          path: |
            build/ios-*.log
            build/swift-network.*/receiver.log
            build/*.xcresult
            build/device/Build/Products/Debug-iphoneos/PhoneMic.app
          retention-days: 7
