name: PhoneMic
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_DISPLAY_NAME: PhoneMic
    PRODUCT_BUNDLE_IDENTIFIER: org.example.phonemic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PhoneMic:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    scheme: {}
