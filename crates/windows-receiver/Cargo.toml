[package]
name = "windows-receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
audio-protocol = { path = "../audio-protocol" }
audio-core = { path = "../audio-core" }
audio-transport = { path = "../audio-transport" }
rustls = { version = "0.23.35", default-features = false, features = ["std", "ring"] }
mdns-sd = "0.21.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hound = "3.5"
serde_json = "1"
rand = "0.8.5"
socket2 = "0.6.5"
rtrb = "0.3.2"
rubato = { version = "0.16.2", default-features = false }

[target.'cfg(windows)'.dependencies]
cpal = "=0.16.0"
wasapi = "=0.26.0"
audio_thread_priority = { version = "0.38", default-features = false }

[lints]
workspace = true
