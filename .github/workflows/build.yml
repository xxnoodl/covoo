name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: cargo run -p windows-receiver --locked
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-receiver-x64
          path: target/release/windows-receiver.exe
          if-no-files-found: error
  ios:
    timeout-minutes: 30
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Test native queue
        run: bash ../../scripts/test-native.sh
      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
          xcodegen --version
          xcodegen generate
      - name: Build simulator and device (unsigned)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../build
          xcodebuild -project PhoneMic.xcodeproj -scheme PhoneMic -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../build/simulator -resultBundlePath ../../build/simulator.xcresult CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../build/ios-simulator.log
          xcodebuild -project PhoneMic.xcodeproj -scheme PhoneMic -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath ../../build/device -resultBundlePath ../../build/device.xcresult CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../build/ios-device.log
      - name: Test synthetic recording
        run: bash ../../scripts/test-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-unsigned-build-and-logs
          path: |
            build/ios-*.log
            build/*.xcresult
            build/device/Build/Products/Debug-iphoneos/PhoneMic.app
          retention-days: 7
