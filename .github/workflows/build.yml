name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s tests/interoperability -p "test_*.py"
      - run: cargo build --workspace --release --locked
      - run: cargo run -p windows-receiver --locked
      - run: cargo run --release --locked -p audio-transport --example crypto_bench
      - name: Package Windows receiver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          Copy-Item target/release/windows-receiver.exe build/windows/covoo-receiver.exe
          Copy-Item scripts/start-receiver.cmd build/windows/start-receiver.cmd
          Copy-Item scripts/start-daw.cmd build/windows/start-daw.cmd
          Copy-Item scripts/start-daw-fast.cmd build/windows/start-daw-fast.cmd
          Copy-Item scripts/start-daw-lowlatency.cmd build/windows/start-daw-lowlatency.cmd
          Copy-Item scripts/latency-audit.py build/windows/latency-audit.py
          Copy-Item docs/testing/m3-device.md build/windows/DAW-setup.md
          Copy-Item docs/performance/latency-investigation.md build/windows/Latency-check.md
          Copy-Item docs/testing/low-period-output.md build/windows/Low-period-test.md
          Copy-Item licenses build/windows/licenses -Recurse
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: covoo-windows-x64
          path: build/windows/*
          if-no-files-found: error
  ios:
    timeout-minutes: 30
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Test native queue
        run: bash ../../scripts/test-native.sh
      - name: Test Swift to Rust network path
        run: bash ../../scripts/test-swift-network.sh
      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
          xcodegen --version
          xcodegen generate
      - name: Build simulator and device (unsigned)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../build
          xcodebuild -project PhoneMic.xcodeproj -scheme PhoneMic -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../build/simulator -resultBundlePath ../../build/simulator.xcresult CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../build/ios-simulator.log
          xcodebuild -project PhoneMic.xcodeproj -scheme PhoneMic -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath ../../build/device -resultBundlePath ../../build/device.xcresult CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../build/ios-device.log
      - name: Test synthetic recording
        run: bash ../../scripts/test-ios.sh
      - name: Package for local signing
        run: bash ../../scripts/package-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: covoo-ios-sideload-package
          path: build/covoo-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: covoo-ios-build-and-logs
          path: |
            build/ios-*.log
            build/*.xcresult
            build/device/Build/Products/Debug-iphoneos/PhoneMic.app
          retention-days: 7
